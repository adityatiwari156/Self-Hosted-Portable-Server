services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale

    hostname: pi5-nas

    environment:
      TS_AUTHKEY: "${TS_AUTHKEY}"
      TS_STATE_DIR: "/var/lib/tailscale"
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "false"

    volumes:
      - ./data:/var/lib/tailscale

    devices:
      - /dev/net/tun:/dev/net/tun

    cap_add:
      - NET_ADMIN
      - NET_RAW

    network_mode: host

    restart: unless-stopped
